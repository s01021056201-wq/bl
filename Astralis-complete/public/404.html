<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      sessionStorage.setItem(
        "astralis_redirect",
        location.pathname + location.search + location.hash
      );
      var base = location.pathname.split("/").filter(Boolean)[0];
      location.replace(base ? "/" + base + "/" : "/");
    })();
  </script>
</head>
<body></body>
</html>
